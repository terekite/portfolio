name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]

permissions:
  id-token: write # allows the workflow to request an OIDC token to assume the AWS role
  contents: read # allows checkout of the repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::089176739161:role/github-deploy-portfolio
          aws-region: us-west-1

      - name: Sync build to S3
        run: aws s3 sync dist/ s3://omarali-portfolio-089176739161-us-west-1-an --delete

      - name: Invalidate CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id E1I0GUSUP0IATG
          --paths "/*"
